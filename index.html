<style>
/* ---------- токены ----------
   Цвета наследуются от клиента Telegram через --tg-theme-*.
   Значения после запятой — фоллбек для обычного браузера. */
:root{
  --bg:          var(--tg-theme-bg-color, #ffffff);
  --bg-elev:     var(--tg-theme-secondary-bg-color, #f2f2f7);
  /* Подложка карточек. В тёмной теме Telegram отдаёт secondary_bg_color
     почти равным основному фону, и карточка сливается со страницей —
     поэтому считаем её сами подмешиванием цвета текста в фон.
     Первая строка — запасной вариант для старых webview без color-mix. */
  --surface:     #f2f2f7;
  --surface:     color-mix(in srgb, var(--text) 5%, var(--bg));
  --hairline:    rgba(60,60,67,.10);
  --text:        var(--tg-theme-text-color, #000000);
  --text-2:      var(--tg-theme-hint-color, #8e8e93);
  --sep:         rgba(60,60,67,.18);
  --accent:      #ff2d55;
  --ink:         #1c1c1e;
  --on-ink:      #ffffff;
  --on-ink-2:    rgba(255,255,255,.72);
  --r-lg: 24px;
  --r-md: 18px;
  --r-sm: 13px;
  --pad: 20px;
  --tabbar-h: 84px;
  --safe-top: 0px;
  --safe-bottom: 0px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:      var(--tg-theme-bg-color, #000000);
    --bg-elev: var(--tg-theme-secondary-bg-color, #1c1c1e);
    --text:    var(--tg-theme-text-color, #ffffff);
    --text-2:  var(--tg-theme-hint-color, #8e8e93);
    --sep:     rgba(235,235,245,.20);
    --ink:     #2c2c2e;
    --surface: #1c1c1e;
    --surface: color-mix(in srgb, var(--text) 9%, var(--bg));
    --hairline: rgba(255,255,255,.08);
  }
}
:root[data-theme="dark"]{
  --bg:      var(--tg-theme-bg-color, #000000);
  --bg-elev: var(--tg-theme-secondary-bg-color, #1c1c1e);
  --text:    var(--tg-theme-text-color, #ffffff);
  --text-2:  var(--tg-theme-hint-color, #8e8e93);
  --sep:     rgba(235,235,245,.20);
  --ink:     #2c2c2e;
  --surface: #1c1c1e;
  --surface: color-mix(in srgb, var(--text) 9%, var(--bg));
  --hairline: rgba(255,255,255,.08);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

}

/* ---------- фильтры ---------- */
.filters{
  position:sticky;top:0;z-index:20;background:var(--bg);

}

/* ---------- список ---------- */
.list{padding:2px var(--pad) 24px;display:flex;flex-direction:column;gap:12px}

.btn{

/* ---------- плавающий контейнер с кнопками ----------

  font-size:11px;font-weight:700;font-style:normal;
  display:grid;place-items:center;
  box-shadow:0 0 0 2px var(--surface);
}
.tabbar__i[aria-selected="true"] .badge{box-shadow:0 0 0 2px var(--bg)}
/* Счётчик выступает за иконку вправо — отодвигаем подпись, чтобы не наезжал */
#tabPicks[aria-selected="true"] .tabbar__lbl{margin-left:9px}
/* ₽₽₽ — без letter-spacing перекладины рублей сливаются в одну линию */
.rub{letter-spacing:.14em}
.hidden{display:none !important}
</style>
</head>
<body>

<header class="greet">
  <div class="greet__text">Привет,&nbsp;<span class="greet__name" id="userName">гость</span></div>
  <div class="greet__ava" id="userAva">И</div>
</header>
<div class="rule"></div>

<!-- ГЛАВНАЯ -->
<main id="screen-home">
  <div class="slider" id="slider"></div>
  <nav class="filters" id="filters"></nav>
  <div class="list" id="list"></div>
  <div class="ver" id="ver"></div>
</main>

<!-- ВЫБРАНО -->
<main id="screen-picks" class="hidden">
  <div id="picksBanner"></div>
  <h2 class="section-h" id="picksHead">Хочу сюда</h2>
  <div class="list" id="picksList"></div>
</main>

<!-- ШТОРКА -->
<!-- ЭКРАН МЕСТА -->
<main id="screen-place" class="hidden">
  <button class="backchip" id="placeBack">
    <svg viewBox="0 0 24 24"><path d="M15 5 8 12l7 7"/></svg><span>Назад</span>
  </button>
  <div class="place__media" id="placeMedia"></div>
  <div class="place__body" id="placeBody"></div>
  <div class="actionbar" id="placeActions">
    <div class="actionbar__fade" aria-hidden="true"></div>
    <button class="btn" id="placePick"></button>
    <button class="btn btn--ghost" id="placeMap">Открыть на карте</button>
  </div>
</main>

<nav class="tabbar">
  <button class="tabbar__i" id="tabHome" aria-selected="true" aria-label="Главная">
    <span class="tabbar__ic">
      <svg viewBox="0 0 24 24"><path d="M3 10.2 12 3l9 7.2V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
    </span>
    <span class="tabbar__lbl">Главная</span>
  </button>
  <button class="tabbar__i" id="tabPicks" aria-label="Выбранные места">
    <span class="tabbar__ic">
      <svg viewBox="0 0 24 24"><path d="M12 20.3 4.6 13a4.6 4.6 0 0 1 6.5-6.5l.9.9.9-.9A4.6 4.6 0 1 1 19.4 13z"/></svg>
      <i class="badge hidden" id="picksBadge">0</i>
    </span>
    <span class="tabbar__lbl">Места</span>
  </button>
</nav>

<script>
(function(){
  "use strict";

  /* ---------- данные ---------- */
  const DATA = JSON.parse(document.getElementById('places-data').textContent);
  const PLACES = DATA.places;
  const CATS = DATA.categories;
  const catLabel = id => (CATS.find(c => c.id === id) || {}).label || '';

  /* градиент вместо фото — пока настоящих картинок нет */
  const GRAD = {
    resto:    'linear-gradient(145deg,#2b1d16,#6b4430 55%,#c08457)',
    cafe:     'linear-gradient(145deg,#1a1a20,#3d3a52 55%,#7a6f9b)',
    active:   'linear-gradient(145deg,#0f2a22,#1f6b52 55%,#4fbf93)',
    passive:  'linear-gradient(145deg,#121a2e,#27406e 55%,#5f83c7)',
    relax:    'linear-gradient(145deg,#2a1520,#6b2a45 55%,#c2708f)',
    creative: 'linear-gradient(145deg,#2a2413,#6b5a1f 55%,#c4a94f)'
  };
  const grad = c => GRAD[c] || GRAD.passive;
  /* Разрядка нужна только шкале «₽₽₽₽» — иначе перекладины рублей сливаются
     в одну линию. Числовые цены («1 800–2 200 ₽») оставляем как есть. */
  const rub = s => /^₽+$/.test(s) ? '<span class="rub">' + s + '</span>' : s;

  /* Фон карточки: фото поверх градиента. Если фото не загрузилось (404,
     защита от хотлинка, нет сети) — слой просто не рисуется и остаётся градиент. */
  const bg = p => p.photo
    ? "url('" + p.photo + "') center/cover no-repeat, " + grad(p.category)
    : grad(p.category);

  /* Ссылка на карту.
     Поиск по одному адресу открывает дом, а не заведение, поэтому ищем
     по названию организации плюс адрес — Яндекс отдаёт карточку места.
     `map`  — готовая ссылка на карточку, если она известна (приоритет);
     `mapq` — как организация называется на Яндекс.Картах, если это
              отличается от заголовка в приложении. */
  function mapUrl(p){
    if (p.map) return p.map;
    const q = ((p.mapq || p.title) + ', ' + p.address).replace(/[«»"]/g, '');
    return 'https://yandex.ru/maps/213/moscow/search/' + encodeURIComponent(q) + '/';
  }

  /* ---------- Telegram ---------- */
  const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
  const haptic = t => { try{ tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred(t||'light'); }catch(e){} };

  if (tg) {
    try {
      tg.ready();
      tg.expand();
      /* Тема наследуется от клиента Telegram. */
      if (tg.colorScheme) document.documentElement.dataset.theme = tg.colorScheme;
      if (tg.setHeaderColor) tg.setHeaderColor('bg_color');
      if (tg.setBackgroundColor) tg.setBackgroundColor('bg_color');

      /* Без этого свайп вниз по списку закрывает мини-апп. Bot API 7.7+ */
      if (tg.isVersionAtLeast && tg.isVersionAtLeast('7.7') && tg.disableVerticalSwipes) {
        tg.disableVerticalSwipes();
      }

      /* Безопасные отступы под чёлку и системную панель. Bot API 8.0+ */
      const applyInsets = () => {
        const s = tg.safeAreaInset || {};
        const c = tg.contentSafeAreaInset || {};
        const r = document.documentElement.style;
        r.setProperty('--safe-top', ((s.top || 0) + (c.top || 0)) + 'px');
        r.setProperty('--safe-bottom', (s.bottom || 0) + 'px');
      };
      if (tg.isVersionAtLeast && tg.isVersionAtLeast('8.0')) {
        applyInsets();
        tg.onEvent('safeAreaChanged', applyInsets);
        tg.onEvent('contentSafeAreaChanged', applyInsets);

        /* Полноэкранный режим. Bot API 8.0+, только мобильные клиенты —
           на десктопе запрос завершится событием fullscreenFailed, и мы
           просто остаёмся в обычном окне. В фулскрине шапка Telegram
           прозрачная и лежит поверх контента, поэтому отступы пересчитываем
           на каждое изменение — иначе приветствие уедет под кнопку Close. */
        if (tg.requestFullscreen) {
          try { tg.requestFullscreen(); } catch(e){}
          tg.onEvent('fullscreenChanged', applyInsets);
          tg.onEvent('fullscreenFailed', applyInsets);
        }
      }

      /* Пользователь переключил тему в Telegram — перекрашиваемся следом. */
      tg.onEvent('themeChanged', () => {
        document.documentElement.dataset.theme = tg.colorScheme;
        try { tg.setHeaderColor('bg_color'); tg.setBackgroundColor('bg_color'); } catch(e){}
      });
    } catch(e){}
  }

  /* ---------- профиль ---------- */
  const u = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) || null;
  const myName = u ? (u.first_name || u.username || 'гость') : 'гость';
  document.getElementById('userName').textContent = myName;
  const ava = document.getElementById('userAva');
  if (u && u.photo_url) {
    const img = new Image();
    img.src = u.photo_url; img.alt = '';
    img.onload = () => { ava.textContent=''; ava.appendChild(img); };
  } else {
    ava.textContent = myName.charAt(0).toUpperCase();
  }

  /* ---------- состояние ---------- */
  const STORE = 'dates.picks.v1';
  let picks = new Set();
  try { picks = new Set(JSON.parse(localStorage.getItem(STORE) || '[]')); } catch(e){}
  const save = () => { try{ localStorage.setItem(STORE, JSON.stringify([...picks])); }catch(e){} };

  let category = 'all';
  let screen = 'home';
  let incoming = null;   // { name, ids } — то, что выбрала она

  /* ---------- входящая подборка ----------
     Telegram разрешает в start_param только A-Za-z0-9_- и 512 символов.
     Раньше сюда клали base64 от JSON — он был вдвое длиннее нужного.
     Сейчас формат простой: Имя__id__id. Имя транслитерируем, id и так
     состоят из разрешённых символов, двойное подчёркивание в них не
     встречается — значит разделитель однозначен. */
  const b64d = s => decodeURIComponent(escape(atob(s.replace(/-/g,'+').replace(/_/g,'/'))));

  const TRANSLIT = {
    а:'a',б:'b',в:'v',г:'g',д:'d',е:'e',ё:'e',ж:'zh',з:'z',и:'i',й:'y',к:'k',л:'l',
    м:'m',н:'n',о:'o',п:'p',р:'r',с:'s',т:'t',у:'u',ф:'f',х:'h',ц:'c',ч:'ch',ш:'sh',
    щ:'sch',ъ:'',ы:'y',ь:'',э:'e',ю:'yu',я:'ya'
  };
  const translit = s => s.split('').map(ch => {
    const low = ch.toLowerCase();
    const t = TRANSLIT[low];
    if (t === undefined) return /[A-Za-z0-9]/.test(ch) ? ch : '';
    return ch === low ? t : t.charAt(0).toUpperCase() + t.slice(1);
  }).join('');

  (function readIncoming(){
    let raw = (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || null;
    if (!raw) raw = new URLSearchParams(location.search).get('picked');
    if (!raw) return;

    /* Старые ссылки (base64 от JSON) продолжают работать — они начинаются с eyJ. */
    if (/^eyJ/.test(raw)) {
      try {
        const o = JSON.parse(b64d(raw));
        if (o && Array.isArray(o.p) && o.p.length) incoming = { name: o.n || 'Партнёр', ids: o.p };
      } catch(e){}
      return;
    }

    const parts = raw.split('__').filter(Boolean);
    if (parts.length < 2) return;
    const ids = parts.slice(1).filter(id => PLACES.some(x => x.id === id));
    if (ids.length) incoming = { name: parts[0] || 'Партнёр', ids };
  })();

  /* ---------- рендер ---------- */
  const el = (tag, cls, html) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (html != null) n.innerHTML = html;
    return n;
  };
  const HEART = '<svg viewBox="0 0 24 24"><path d="M12 20.3 4.6 13a4.6 4.6 0 0 1 6.5-6.5l.9.9.9-.9A4.6 4.6 0 1 1 19.4 13z"/></svg>';

  function renderSlider(){
    const box = document.getElementById('slider');
    box.innerHTML = '';
    PLACES.filter(p => p.top).forEach(p => {
      const s = el('button','slide');
      s.innerHTML =
        '<div class="slide__eyebrow">' + catLabel(p.category) + '</div>' +
        '<h3 class="slide__title">' + p.title + '</h3>' +
        '<div class="slide__sub">' + p.tagline + '</div>' +
        '<div class="slide__media" style="background:' + bg(p) + '">' +
          '<span class="slide__badge">' + p.area + '</span>' +
          '<div class="slide__foot">' +
            '<span class="slide__meta">' + rub(p.price) + ' · ' + p.duration + '</span>' +
            '<span class="slide__arrow">→</span>' +
            '<span class="slide__cta">Открыть</span>' +
          '</div>' +
        '</div>';
      s.addEventListener('click', () => openPlace(p.id));
      box.appendChild(s);
    });
  }

  function renderFilters(){
    const box = document.getElementById('filters');
    box.innerHTML = '';
    const all = el('button','chip-all','Все');
    all.setAttribute('aria-selected', category === 'all');
    all.addEventListener('click', () => { category='all'; haptic(); renderFilters(); renderList(); });
    box.appendChild(all);
    box.appendChild(el('div','filters__sep'));
    CATS.forEach(c => {
      const t = el('button','tab', c.label);
      t.setAttribute('aria-selected', category === c.id);
      t.addEventListener('click', () => { category=c.id; haptic(); renderFilters(); renderList(); });
      box.appendChild(t);
    });
  }

  function cardNode(p, opts){
    opts = opts || {};
    const c = el('div','card');
    c.innerHTML =
      '<div class="card__media" style="background:' + bg(p) + '">' +
        '<span class="card__kind">' + catLabel(p.category) + '</span>' +
        (opts.noHeart ? '' :
          '<button class="heart" aria-pressed="' + picks.has(p.id) + '" aria-label="Хочу сюда">' + HEART + '</button>') +
      '</div>' +
      '<div class="card__body">' +
        '<h3 class="card__title">' + p.title + '</h3>' +
        '<div class="card__meta">' + p.area + ' · ' + rub(p.price) + ' · ' + p.duration + '</div>' +
        '<p class="card__desc">' + p.description + '</p>' +
      '</div>';
    c.addEventListener('click', e => {
      if (e.target.closest('.heart')) return;
      openPlace(p.id);
    });
    const h = c.querySelector('.heart');
    if (h) h.addEventListener('click', e => { e.stopPropagation(); toggle(p.id); });
    return c;
  }

  function renderList(){
    const box = document.getElementById('list');
    box.innerHTML = '';
    const items = PLACES.filter(p => category === 'all' || p.category === category);
    if (!items.length){
      box.appendChild(el('div','empty','<strong>Пока пусто</strong>В этой категории ещё нет мест'));
      return;
    }
    items.forEach(p => box.appendChild(cardNode(p)));
  }

  function renderPicks(){
    const banner = document.getElementById('picksBanner');
    const head = document.getElementById('picksHead');
    const box = document.getElementById('picksList');
    banner.innerHTML = ''; box.innerHTML = '';

    if (incoming){
      /* Имя в Telegram может быть с маленькой буквы — в заголовке поднимаем */
      const who = incoming.name.charAt(0).toUpperCase() + incoming.name.slice(1);
      head.textContent = who + ' хочет сюда';
      banner.appendChild(el('div','banner',
        '<span class="banner__dot"></span><div>' +
        '<div class="banner__t">Новая подборка</div>' +
        '<div class="banner__s">' + incoming.ids.length + ' ' + plural(incoming.ids.length,'место','места','мест') + ' — выбери, куда идёте</div>' +
        '</div>'));
      incoming.ids.forEach(id => {
        const p = PLACES.find(x => x.id === id);
        if (p) box.appendChild(cardNode(p, {noHeart:true}));
      });
      return;
    }

    head.textContent = 'Хочу сюда';
    if (!picks.size){
      box.appendChild(el('div','empty',
        '<strong>Ещё ничего не выбрано</strong>Жми на сердечко у мест, которые нравятся — потом отправишь список одним сообщением'));
      return;
    }
    [...picks].forEach(id => {
      const p = PLACES.find(x => x.id === id);
      if (p) box.appendChild(cardNode(p));
    });
  }

  function plural(n,a,b,c){
    const n10=n%10, n100=n%100;
    if (n10===1 && n100!==11) return a;
    if (n10>=2 && n10<=4 && (n100<10||n100>=20)) return b;
    return c;
  }

  /* ---------- выбор ---------- */
  function toggle(id){
    if (picks.has(id)) picks.delete(id); else picks.add(id);
    save(); haptic('medium'); syncUI();
  }

  function syncUI(){
    renderList();
    if (screen === 'picks') renderPicks();
    const badge = document.getElementById('picksBadge');
    badge.textContent = picks.size;
    badge.classList.toggle('hidden', picks.size === 0 || !!incoming);
    syncMainButton();
    const placeBtn = document.getElementById('placePick');
    if (placeBtn && openId){
      const on = picks.has(openId);
      placeBtn.textContent = on ? 'В списке — убрать' : 'Хочу сюда';
      placeBtn.classList.toggle('btn--on', on);
    }
  }

  /* ---------- экран места ----------
     Раньше это была шторка поверх документа: жест скролла уходил
     на страницу под ней, и листалась она, а не карточка. Теперь это
     обычный экран — скроллится сам документ, проблема уходит вместе
     с конструкцией. */
  let openId = null;

  function openPlace(id){
    const p = PLACES.find(x => x.id === id);
    if (!p) return;
    openId = id;

    document.getElementById('placeMedia').style.background = bg(p);
    document.getElementById('placeBody').innerHTML =
      '<div class="place__kind">' + catLabel(p.category) + '</div>' +
      '<h2 class="place__title">' + p.title + '</h2>' +
      '<div class="place__tagline">' + p.tagline + '</div>' +
      '<div class="facts">' +
        '<div class="fact"><span class="fact__k">Адрес</span><span class="fact__v">' + p.address + '</span></div>' +
        '<div class="fact"><span class="fact__k">Район</span><span class="fact__v">' + p.area + '</span></div>' +
        '<div class="fact"><span class="fact__k">Чек</span><span class="fact__v">' + rub(p.price) + '</span></div>' +
        '<div class="fact"><span class="fact__k">Сколько</span><span class="fact__v">' + p.duration + '</span></div>' +
      '</div>' +
      '<p class="place__desc">' + p.description + '</p>' +
      '<div class="tagrow">' + p.tags.map(t => '<span>' + t + '</span>').join('') + '</div>';

    go('place');
    syncUI();
  }

  document.getElementById('placePick').addEventListener('click', () => {
    if (openId) toggle(openId);
  });
  document.getElementById('placeMap').addEventListener('click', () => {
    const p = PLACES.find(x => x.id === openId);
    if (!p) return;
    const url = mapUrl(p);
    if (tg && tg.openLink) tg.openLink(url); else window.open(url,'_blank');
  });
  document.getElementById('placeBack').addEventListener('click', goBack);

  /* ---------- отправка партнёру ---------- */
  /* Telegram ограничивает start_param 512 символами — режем список, если не влезает */
  const START_PARAM_MAX = 500;
  function buildPayload(){
    const ids = [...picks];
    const name = (translit(myName).slice(0, 14)) || 'Partner';
    let payload = [name].concat(ids).join('__');
    while (payload.length > START_PARAM_MAX && ids.length > 1){
      ids.pop();
      payload = [name].concat(ids).join('__');
    }
    return { payload, ids };
  }
  function share(){
    const { payload, ids } = buildPayload();
    const names = ids.map(id => (PLACES.find(x => x.id === id) || {}).title).filter(Boolean);
    if (!names.length) return;
    const cut = ids.length < picks.size;
    const text = 'Смотри, куда мне хочется:\n\n• ' + names.join('\n• ') +
                 (cut ? '\n\n(и ещё пара вариантов)' : '') + '\n\nОткрой и выбери 👇';
    const link = CONFIG.APP_LINK + '?startapp=' + payload;
    const url = 'https://t.me/share/url?url=' + encodeURIComponent(link) +
                '&text=' + encodeURIComponent(text);
    if (tg && tg.openTelegramLink) tg.openTelegramLink(url);
    else window.open(url,'_blank');
  }

  function syncMainButton(){
    const show = screen === 'picks' && !incoming && picks.size > 0;
    /* Системная кнопка не должна появляться ни при каких условиях */
    if (tg && tg.MainButton) { try { tg.MainButton.hide(); } catch(e){} }
    if (fallbackBtn){
      fallbackBtn.textContent = 'Отправить партнёру · ' + picks.size;
      fallbackBar.style.display = show ? 'flex' : 'none';
    }
  }

  /* ---------- навигация ---------- */
  const tabHome = document.getElementById('tabHome');
  const tabPicks = document.getElementById('tabPicks');
  const tabbar = document.querySelector('.tabbar');
  let backTo = 'home';        // куда вернуться с экрана места
  const scrollMemo = {};      // позиция списка, чтобы не терять место

  function go(next){
    if (next === 'place' && screen !== 'place') {
      backTo = screen;
      scrollMemo[screen] = window.scrollY;
    }
    screen = next;
    document.body.dataset.screen = next;
    document.getElementById('screen-home').classList.toggle('hidden', next !== 'home');
    document.getElementById('screen-picks').classList.toggle('hidden', next !== 'picks');
    document.getElementById('screen-place').classList.toggle('hidden', next !== 'place');
    tabbar.classList.toggle('hidden', next === 'place');
    tabHome.setAttribute('aria-selected', next === 'home');
    tabPicks.setAttribute('aria-selected', next === 'picks');
    if (next === 'picks') renderPicks();

    /* Кнопка «назад»: своя в браузере, системная в Telegram */
    if (tg && tg.BackButton) {
      if (next === 'place') tg.BackButton.show(); else tg.BackButton.hide();
    }

    window.scrollTo(0, next === 'place' ? 0 : (scrollMemo[next] || 0));
    syncMainButton();
  }

  function goBack(){
    if (screen !== 'place') return;
    haptic();
    openId = null;
    go(backTo);
  }
  if (tg && tg.BackButton) tg.onEvent('backButtonClicked', goBack);

  tabHome.addEventListener('click', () => { haptic(); openId = null; go('home'); });
  tabPicks.addEventListener('click', () => { haptic(); openId = null; go('picks'); });

  /* fallback-кнопка отправки, если MainButton недоступна (обычный браузер) */
  /* Кнопка отправки — своя на всех платформах. Системную MainButton не
     используем: она рисуется клиентом за пределами webview, берёт цвет
     из темы Telegram и выбивается из остальных экранов. */
  let fallbackBtn = null, fallbackBar = null;
  {
    if (!tg) document.body.classList.add('no-tg');
    fallbackBar = document.createElement('div');
    fallbackBar.className = 'actionbar actionbar--above';
    fallbackBar.style.display = 'none';
    fallbackBar.innerHTML = '<div class="actionbar__fade" aria-hidden="true"></div>';
    fallbackBtn = document.createElement('button');
    fallbackBtn.className = 'btn';
    fallbackBtn.id = 'fallbackShare';
    fallbackBtn.textContent = 'Отправить партнёру';
    fallbackBtn.addEventListener('click', share);
    fallbackBar.appendChild(fallbackBtn);
    document.body.appendChild(fallbackBar);
  }

  /* ---------- старт ---------- */
  document.getElementById('ver').textContent =
    'версия ' + CONFIG.VERSION + ' · ' + PLACES.length + ' ' +
    plural(PLACES.length, 'место', 'места', 'мест');
  renderSlider();
  renderFilters();
  renderList();
  syncUI();
  go(incoming ? 'picks' : 'home');
})();
</script>
</body>
</html>
